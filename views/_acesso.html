{# Painel da esquerda das telas de login e cadastro: fotos instantâneas espalhadas na mesa #}
<aside class="acesso-painel" aria-hidden="true">
    <span class="luz luz-1"></span>
    <span class="luz luz-2"></span>

    <a class="marca marca-clara" href="{{ url_for('login') }}">instantâneo<span class="marca-flash"></span></a>

    <div class="mesa">
        <figure class="mini-foto f1"><div class="mini-img i1"></div><figcaption>intervalo ☀️</figcaption></figure>
        <figure class="mini-foto f2"><div class="mini-img i2"></div><figcaption>feira de ciências</figcaption></figure>
        <figure class="mini-foto f3"><div class="mini-img i3"></div><figcaption>a turma toda!</figcaption></figure>
    </div>

    <div class="acesso-texto">
        <p class="acesso-frase">As fotos da turma, num lugar só.</p>
        <ul class="acesso-recursos">
            <li><i class="bi bi-images"></i> Publique fotos com legenda escrita à mão</li>
            <li><i class="bi bi-heart"></i> Curta e comente as fotos dos colegas</li>
            <li><i class="bi bi-chat-dots"></i> Converse ao vivo no chat da turma</li>
        </ul>
    </div>
</aside>
